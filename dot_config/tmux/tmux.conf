# ~/.config/tmux/tmux.conf. Managed by chezmoi (github.com/guanxiongsun/my_configs).
# Reload: prefix r. Install new plugins: prefix I.

# --- general -------------------------------------------------------------------
set -g prefix2 C-a                 # C-a works as prefix too (C-b stays)
bind C-a send-prefix -2
set -g mouse on
set -g allow-rename off            # keep window names programs try to set via escape codes
set -g history-limit 50000
set -g escape-time 10
set -g focus-events on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g set-clipboard on            # copy to the local clipboard over SSH (OSC 52)
# New panes run zsh from pixi even when the login shell is still bash (no chsh on shared servers).
if-shell 'test -x "$HOME/.pixi/bin/zsh"' 'set -g default-shell "$HOME/.pixi/bin/zsh"'

# Colors: use tmux-256color only where the system knows it; enable true color.
if-shell 'infocmp tmux-256color >/dev/null 2>&1' \
  'set -g default-terminal "tmux-256color"' \
  'set -g default-terminal "screen-256color"'
set -as terminal-features ',xterm-256color:RGB,xterm-kitty:RGB,alacritty:RGB,wezterm:RGB'

# --- windows & panes: always open in the current directory -----------------------
bind c new-window -c '#{pane_current_path}'
bind '"' split-window -v -c '#{pane_current_path}'
bind % split-window -h -c '#{pane_current_path}'
bind - split-window -v -c '#{pane_current_path}'
bind | split-window -h -c '#{pane_current_path}'
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R
bind r source-file ~/.config/tmux/tmux.conf \; display 'tmux.conf reloaded'

# --- copy mode (vi keys) ----------------------------------------------------------
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# --- theme: catppuccin -------------------------------------------------------------
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style 'rounded'
set -g @catppuccin_window_text ' #W'
set -g @catppuccin_window_current_text ' #W'

# --- plugins (tpm) ------------------------------------------------------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'catppuccin/tmux#v2.3.1'
run '~/.config/tmux/plugins/tpm/tpm'

# Status line (after the theme is loaded, so its #{@catppuccin_*} variables exist).
set -g status-left ''
set -g status-right-length 100
set -g status-right '#{E:@catppuccin_status_session}#{E:@catppuccin_status_user}#{E:@catppuccin_status_host}#{E:@catppuccin_status_date_time}'
